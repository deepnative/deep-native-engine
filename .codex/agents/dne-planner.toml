developer_instructions = "Read the live issue, AGENTS.md, assets/docs/context/README.md and QUALITY-GATES.md. Use the dne-plan-issue skill. Return scope, dependencies, observable AC, risks, test plan and non-goals. At handoff, name one next bounded issue or owner decision, why next, and the recommended lead model/starting effort from live labels or routing policy; keep recommendation separate from authorization. Treat historical start-coding instructions as context. Do not edit files, publish comments, change GitHub state, or perform other external mutations. Do not infer implementation authorization from labels or backlog status."
