name: Deploy Azure application

# Deploy only an exact current main. The first durable cutover also
# requires the operator's fresh frozen-snapshot/restore receipt; never reset the
# inherited ephemeral database as an image-roll side effect.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cutover_receipt:
        description: 'First durable cutover only: fresh nonsecret preservation receipt JSON'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-azure-application
  cancel-in-progress: false

env:
  ACR_NAME: acralzyhpx31oc
  RESOURCE_GROUP: rg-deepnative-dev-canadacentral
  CONTAINER_APP: ca-deepnative-dev

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DNE_DURABLE_RELEASE_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Select the current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          DNE_REPOSITORY: ${{ github.repository }}
          DNE_EVENT_NAME: ${{ github.event_name }}
          DNE_EVENT_SHA: ${{ github.sha }}
          DNE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          try:
              repository = os.environ['DNE_REPOSITORY']
              sha = os.environ['DNE_EVENT_SHA']
              if (not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository)
                      or not re.fullmatch(r'[0-9a-f]{40}', sha)
                      or os.environ['DNE_REF'] != 'refs/heads/main'
                      or os.environ['DNE_EVENT_NAME'] not in ('push', 'workflow_dispatch')):
                  raise ValueError()
              result = subprocess.run(
                  ['gh', 'api', f'repos/{repository}/commits/main', '--jq', '.sha'],
                  capture_output=True, text=True, timeout=20, check=True,
              )
              current = result.stdout.strip()
              if not re.fullmatch(r'[0-9a-f]{40}', current):
                  raise ValueError()
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  if current == sha:
                      output.write(f'sha={sha}\neligible=true\n')
                  else:
                      output.write('eligible=false\n')
              if current != sha:
                  print('Main changed; this deployment is skipped.')
          except Exception:
              print('Cannot select current main for deployment; inspect source and API access.', file=sys.stderr)
              sys.exit(1)
          PY
      - name: Check out the selected revision
        if: steps.revision.outputs.eligible == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - name: Sign in to Azure with GitHub OIDC
        if: steps.revision.outputs.eligible == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate the preserved target before building
        if: steps.revision.outputs.eligible == 'true'
        env:
          DNE_REVISION: ${{ steps.revision.outputs.sha }}
          DNE_CUTOVER_RECEIPT: ${{ inputs.cutover_receipt }}
        run: |
          set -euo pipefail
          umask 077
          app_url="https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$CONTAINER_APP?api-version=2024-03-01"
          az rest --method get --url "$app_url" -o json > preflight-app.json
          python3 scripts/azure-release.py prepare preflight-app.json "$DNE_REVISION" preflight-patch.json
          rm preflight-patch.json
          if [ -n "$DNE_CUTOVER_RECEIPT" ]; then
            replica_url="${app_url%%\?*}/revisions/ca-deepnative-dev--0000001/replicas?api-version=2024-03-01"
            az rest --method get --url "$replica_url" -o json > preflight-replicas.json
            python3 scripts/azure-release.py replicas preflight-replicas.json
            python3 scripts/azure-release.py maintenance
          fi
      - name: Build and push the app and proxy images
        if: steps.revision.outputs.eligible == 'true'
        env:
          DNE_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          registry="$ACR_NAME.azurecr.io"
          az acr login --name "$ACR_NAME"
          docker build --platform linux/amd64 -t "$registry/deepnative/app:$DNE_REVISION" .
          docker build --platform linux/amd64 -t "$registry/deepnative/proxy:$DNE_REVISION" infra/proxy
          docker push "$registry/deepnative/app:$DNE_REVISION"
          docker push "$registry/deepnative/proxy:$DNE_REVISION"
      - name: Roll the Container App to the selected images
        if: steps.revision.outputs.eligible == 'true'
        env:
          DNE_REVISION: ${{ steps.revision.outputs.sha }}
          DNE_CUTOVER_RECEIPT: ${{ inputs.cutover_receipt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          app_url="https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/containerApps/$CONTAINER_APP?api-version=2024-03-01"
          trap 'rm -f app.json patch.json current-app.json preflight-app.json preflight-replicas.json current-replicas.json' EXIT
          az rest --method get --url "$app_url" -o json > app.json
          python3 "$GITHUB_WORKSPACE/scripts/azure-release.py" unchanged preflight-app.json app.json
          python3 "$GITHUB_WORKSPACE/scripts/azure-release.py" prepare app.json "$DNE_REVISION" patch.json
          # A new main or an external template/config change invalidates this roll.
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current_main" != "$DNE_REVISION" ]; then
            echo 'Main changed during build; no deployment performed.'
            exit 1
          fi
          az rest --method get --url "$app_url" -o json > current-app.json
          python3 "$GITHUB_WORKSPACE/scripts/azure-release.py" unchanged app.json current-app.json
          if [ -n "$DNE_CUTOVER_RECEIPT" ]; then
            replica_url="${app_url%%\?*}/revisions/ca-deepnative-dev--0000001/replicas?api-version=2024-03-01"
            az rest --method get --url "$replica_url" -o json > current-replicas.json
            python3 "$GITHUB_WORKSPACE/scripts/azure-release.py" replicas current-replicas.json
            python3 "$GITHUB_WORKSPACE/scripts/azure-release.py" maintenance
          fi
          az rest --method patch --url "$app_url" --body @patch.json -o none
      - name: Wait for the revision and public availability
        if: steps.revision.outputs.eligible == 'true'
        env:
          DNE_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          url="https://engine.deepnative.io"
          for _ in $(seq 1 40); do
            images=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --query "properties.template.containers[].image" -o tsv)
            state=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --query properties.latestReadyRevisionName -o tsv)
            latest=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --query properties.latestRevisionName -o tsv)
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "$url/" || true)
            if [ "$state" = "$latest" ] && [ "$code" = "200" ] \
              && [ "$(printf '%s\n' "$images" | grep -c ":$DNE_REVISION$")" = "2" ]; then
              echo "Deployed $DNE_REVISION to $url"
              exit 0
            fi
            sleep 15
          done
          echo 'The new revision did not become ready with a healthy public page.' >&2
          exit 1
