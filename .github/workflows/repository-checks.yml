name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ github.event_name != 'push' }}
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ github.event_name != 'push' }}
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: ${{ github.event_name != 'push' }}
        with:
          terraform_wrapper: false
      - name: Check Terraform formatting
        if: ${{ github.event_name != 'push' }}
        run: terraform fmt -check -recursive infra
      - run: npm ci
        if: ${{ github.event_name != 'push' }}
      - name: Start PostgreSQL
        if: ${{ github.event_name != 'push' }}
        run: docker compose up -d --wait
      - name: Select the Ubuntu archive directly
        if: ${{ github.event_name != 'push' }}
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          source = Path('/etc/apt/sources.list.d/ubuntu.sources')
          original = source.read_text()
          mirror = 'mirror+file:/etc/apt/apt-mirrors.txt'
          if mirror not in original:
              raise SystemExit('Expected Ubuntu mirror source is missing; inspect the runner image.')
          source.write_text(original.replace(mirror, 'https://archive.ubuntu.com/ubuntu'))
          PY
      - run: npx playwright install --with-deps chromium firefox webkit
        if: ${{ github.event_name != 'push' }}
      - name: Run the shared verification command
        if: ${{ github.event_name != 'push' }}
        run: make verify
      - name: Scan generated artifacts before display or upload
        id: artifact_scan
        if: ${{ github.event_name != 'push' && !cancelled() }}
        run: python3 scripts/repo.py scan-artifacts
      - name: Show verification evidence
        if: ${{ github.event_name != 'push' && !cancelled() && steps.artifact_scan.outcome == 'success' }}
        run: |
          if [ -f artifacts/repository-verification.json ]; then
            cat artifacts/repository-verification.json
          else
            echo 'Verification report missing; inspect the failed step.'
            exit 1
          fi
      - name: Preserve verification reports and failure traces
        if: ${{ github.event_name != 'push' && !cancelled() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-ubuntu-latest
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compact original verified-source proof
        if: ${{ success() && github.event_name != 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-source
          path: |
            artifacts/repository-verification.json
            artifacts/application-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Promote original PR verification for identical current main
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/promote-verification.py
      - name: Preserve main promotion provenance
        if: ${{ success() && github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-promotion
          path: artifacts/main-promotion.json
          if-no-files-found: error
          retention-days: 14
