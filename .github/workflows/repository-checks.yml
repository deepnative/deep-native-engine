name: Repository checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL
        run: docker compose up -d --wait
      - run: npx playwright install --with-deps chromium
      - name: Run the shared verification command
        run: make verify
      - name: Scan generated artifacts before display or upload
        id: artifact_scan
        if: ${{ !cancelled() }}
        run: python3 scripts/repo.py scan-artifacts
      - name: Show verification evidence
        if: ${{ !cancelled() && steps.artifact_scan.outcome == 'success' }}
        run: |
          if [ -f artifacts/repository-verification.json ]; then
            cat artifacts/repository-verification.json
          else
            echo 'Verification report missing; inspect the failed step.'
            exit 1
          fi
      - name: Preserve verification reports and failure traces
        if: ${{ !cancelled() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-ubuntu-latest
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
