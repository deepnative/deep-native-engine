name: Repository checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL on Linux
        if: runner.os == 'Linux'
        run: docker compose up -d --wait
      - name: Start isolated PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18
          PG_BIN="$(brew --prefix postgresql@18)/bin"
          "$PG_BIN/initdb" -D "$RUNNER_TEMP/dne-pg" -U dne --auth=trust
          "$PG_BIN/pg_ctl" -D "$RUNNER_TEMP/dne-pg" -l "$RUNNER_TEMP/dne-pg.log" -o "-h 127.0.0.1 -p 54329" -w start
          "$PG_BIN/createdb" -h 127.0.0.1 -p 54329 -U dne dne_dev
      - run: npx playwright install --with-deps chromium
      - name: Run the shared verification command
        run: make verify
      - name: Show verification evidence
        if: always()
        run: |
          if [ -f artifacts/repository-verification.json ]; then
            cat artifacts/repository-verification.json
          else
            echo 'Verification report missing; inspect the failed step.'
            exit 1
          fi
      - name: Preserve verification reports and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
