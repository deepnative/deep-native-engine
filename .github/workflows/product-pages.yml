name: Publish product introduction

on:
  workflow_run:
    workflows: [Repository checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Select the verified current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          DNE_REPOSITORY: ${{ github.repository }}
          DNE_EVENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$DNE_REPOSITORY/commits/main" --jq '.sha')
          if [ "$DNE_EVENT_SHA" != "$main_sha" ]; then
            echo 'A newer main revision exists; this publication is skipped.'
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          verified=$(gh api "repos/$DNE_REPOSITORY/actions/workflows/repository-checks.yml/runs?branch=main&event=push&status=success&head_sha=$main_sha&per_page=100" --jq ".workflow_runs | map(select(.head_sha == \"$main_sha\" and .conclusion == \"success\")) | length")
          if [ "$verified" -eq 0 ]; then
            echo 'Current main has no successful repository verification.'
            exit 1
          fi
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
      - name: Check out the verified revision
        if: steps.revision.outputs.eligible == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - name: Stamp the public build revision
        if: steps.revision.outputs.eligible == 'true'
        env:
          DNE_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          test -f site/index.html
          printf '{"revision":"%s"}\n' "$DNE_REVISION" > site/build.json
      - name: Configure Pages
        if: steps.revision.outputs.eligible == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the product site only
        if: steps.revision.outputs.eligible == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Publish GitHub Pages
        if: steps.revision.outputs.eligible == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
